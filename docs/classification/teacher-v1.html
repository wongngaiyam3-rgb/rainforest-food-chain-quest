<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動物分類研究站｜教師紀錄</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./"><span class="brand-icon">❧</span><span><small>FIELD LAB / TEACHER</small><b>動物分類研究紀錄</b></span></a><nav><a href="./">學生入口</a><a href="../teacher/">食物鏈教師頁</a></nav></header><main><section class="panel" id="login"><h1>教師研究室</h1><p>使用本雨林探索專案的教師密碼，查看分類過程與學習成果。</p><form id="loginForm"><label>教師密碼<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">登入查看</button><p id="loginError" role="alert"></p></form></section><section id="dashboard" hidden><section class="panel"><h2>全班分類進度</h2><p class="muted">75 位學生｜班號為學生自行報到；正確分類以類群與證據均一致計算。分數供形成性評估參考。</p><div class="actions"><label>班別<select id="class"><option value="all">全部班別</option><option>4A</option><option>4B</option><option>4C</option></select></label><label>學號<select id="number"><option value="all">全部學號</option></select></label><button id="refresh">重新整理</button><button id="csv">匯出 CSV</button><button id="logout">登出</button></div><p id="status" role="status"></p><div class="table-scroll"><table class="teacher-table"><thead><tr><th>學生</th><th>觀察</th><th>第一次分類</th><th>正確＋證據</th><th>正式提交</th><th>最後上傳</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="detail" class="panel" hidden></section></section></main><script type="module" src="teacher-v1.js"></script></body></html>
