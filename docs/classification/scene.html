<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨林動物近看</title><style>body{margin:0;background:#a3c4a3;font:14px system-ui}#scene{position:fixed;inset:0;touch-action:none}#tools{position:fixed;bottom:10px;left:10px;display:flex;gap:6px}button{padding:10px 16px;border:0;border-radius:9px;background:#fffdf1;color:#173e33;touch-action:manipulation}#message{position:fixed;top:5px;left:10px;background:#ffffffdf;border-radius:8px;padding:6px;max-width:90vw}</style></head><body><div id="scene"></div><div id="message" role="status">正在準備 3D 觀察…</div><div id="tools"><button id="plus" aria-label="拉近">＋</button><button id="minus" aria-label="拉遠">−</button><button id="reset">重設視角</button></div><script type="module">
import {ensureStudent} from '../shared/passport.js?v=plant-polish-v2';
await ensureStudent();
try{const {createWorld}=await import('../world.js?v=plant-polish-v2');const w=createWorld(document.querySelector('#scene'),'low');const id=new URLSearchParams(location.search).get('animal');const a=w.animals.find(a=>a.id===id);if(!a)throw Error('請先選擇動物');w.focusAnimal(a);document.querySelector('#message').textContent='拖曳轉動，觀察身體特徵（教學模型）';let last=performance.now();const run=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;w.update(dt,t/1000,{x:0,y:0},false);w.render();requestAnimationFrame(run)};requestAnimationFrame(run);let prev=null;const el=document.querySelector('#scene');el.onpointerdown=e=>{prev={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!prev)return;w.rotate(e.clientX-prev.x,e.clientY-prev.y);prev={x:e.clientX,y:e.clientY}};el.onpointerup=el.onpointercancel=()=>prev=null;document.querySelector('#plus').onclick=()=>w.zoom(-1);document.querySelector('#minus').onclick=()=>w.zoom(1);document.querySelector('#reset').onclick=()=>{w.center();w.focusAnimal(a)};window.onresize=()=>w.resize();}catch(e){document.querySelector('#message').textContent='3D 暫時未能載入，請使用動物插圖觀察。';}
</script></body></html>
