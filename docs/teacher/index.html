<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教師觀察站 · 四域探索學習護照</title><link rel="stylesheet" href="../shared/passport.css?v=passport-v1"></head><body class="passport-page"><main class="passport-main"><p class="passport-muted">TEACHER OBSERVATORY · 2026–27</p><h1>看見每一位學生的發現。</h1><section id="login" class="passport-box"><form id="loginForm"><label>教師密碼<input type="password" id="password" required autocomplete="current-password"></label><button>登入教師觀察站</button><p id="loginError" class="passport-error" role="alert"></p><a href="../notebook/">返回學生入口</a></form></section><section id="dashboard" hidden><div class="passport-nav"><button id="refresh">立即更新</button><button id="export">匯出食物鏈 CSV</button><button id="logout">教師登出</button><a href="../notebook/">學生筆記入口</a></div><p id="status" role="status"></p><div class="passport-filter"><label>班別 <select id="class"><option value="all">全部班別</option><option>4A</option><option>4B</option><option>4C</option></select></label><label>學號 <select id="number"><option value="all">全部學號</option></select></label><label>生態域 <select id="biome"><option value="all">四域合計</option></select></label><label>由 <input type="date" id="from"></label><label>至 <input type="date" id="to"></label></div><p class="passport-muted">點選班別學號，查看該學生的兩本筆記。尚未收到雲端紀錄，可能是未開始或裝置仍待同步。</p><div class="passport-scroll"><table class="passport-table"><thead><tr><th>學生</th><th>動物</th><th>生產者</th><th>不同食物鏈</th><th>最長鏈</th><th>最後收到紀錄</th></tr></thead><tbody id="rows"></tbody></table></div><section id="detail" class="passport-detail" hidden></section></section></main><script type="module" src="./teacher.js?v=passport-v1"></script></body></html>
