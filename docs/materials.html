<!doctype html><meta charset="utf-8"><title>動物材質觀察室 · 雨林食物鏈探險隊</title><style>*{box-sizing:border-box}body{margin:0;background:#e6e9dd;color:#284338;font-family:sans-serif}header{padding:20px 30px;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}button,select{padding:12px;font-size:16px;border:1px solid #94ac99;border-radius:10px;background:#fffef6}#view{height:650px}#status{font-size:14px}canvas{display:block}</style><header><div><h1>動物材質觀察室</h1><p id="status">準備毛皮、鱗片與羽毛細節…</p></div><select id="species"></select><button id="angle">旋轉視角 ↻</button><a href="./" style="color:#284338">返回雨林 ↗</a></header><div id="view"></div><script type="module">
import * as T from './vendor/three.module.v3.js';import {createAnimal,animateModel} from './models.js?v=wildlife-v4-2';import {loadAnimalTextures} from './animal-materials.js?v=wildlife-v4-2';import {SoftwareRenderer} from './software-renderer.js?v=wildlife-v4-2';import {animalSpecies} from './data.js';
let renderer;try{renderer=new T.WebGLRenderer({antialias:true});}catch{renderer=new SoftwareRenderer();}renderer.setSize(innerWidth,650);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.04;document.querySelector('#view').append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#b8c6b2');scene.add(new T.HemisphereLight('#fff8ec','#6c775f',2));const sun=new T.DirectionalLight('#fff1db',2.8);sun.position.set(-3,6,5);scene.add(sun);const camera=new T.PerspectiveCamera(35,innerWidth/650,.01,40);let model,theta=.95,center,size;const select=document.querySelector('select');select.innerHTML=animalSpecies.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');function change(){if(model)scene.remove(model);model=createAnimal(select.value);scene.add(model);const box=new T.Box3().setFromObject(model);center=box.getCenter(new T.Vector3());size=box.getSize(new T.Vector3()).length();render();}function render(){const d=size*1.25;camera.position.set(center.x+Math.sin(theta)*d,center.y+d*.16,center.z+Math.cos(theta)*d);camera.lookAt(center);renderer.render(scene,camera);}select.onchange=change;select.value='jaguar';change();document.querySelector('#angle').onclick=()=>{theta+=.6;render();};const textures=loadAnimalTextures(renderer);textures.ready.then(()=>{document.querySelector('#status').textContent=textures.status.failed.length?'部分材質未能載入，請重新整理。':'Wildlife V4 · 15 種動物的真實感彩色材質已載入';render();});window.addEventListener('resize',()=>{renderer.setSize(innerWidth,650);camera.aspect=innerWidth/650;camera.updateProjectionMatrix();render();});
</script>
